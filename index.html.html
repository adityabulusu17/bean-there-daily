<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bean There Daily! — Indis Viva City</title>
  <style>
    :root {
      --bg: #12100e;
      --card-bg: #1c1815;
      --accent: #e5a93b;
      --accent-hover: #f5ba4c;
      --text: #f5efe6;
      --text-muted: #a89f91;
      --border: #332b25;
      --danger: #e74c3c;
      --success: #2ecc71;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; max-width: 600px; margin: 0 auto; line-height: 1.4; }

    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 2px solid var(--border); margin-bottom: 15px; }
    h1 { font-size: 1.5rem; color: var(--accent); letter-spacing: 0.5px; }
    .header-btns { display: flex; gap: 8px; }
    
    button { background-color: var(--accent); color: #000; border: none; padding: 8px 12px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
    button:hover { background-color: var(--accent-hover); }
    button.secondary { background-color: transparent; color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background-color: var(--border); }

    .accordion { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
    .accordion-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; background: #231e1a; }
    .accordion-header:hover { background: #2a241f; }
    .accordion-content { padding: 15px; display: none; }
    .accordion.active .accordion-content { display: block; }
    .accordion-icon { transition: transform 0.2s; }
    .accordion.active .accordion-icon { transform: rotate(180deg); }

    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .menu-item { background: var(--bg); padding: 10px; border-radius: 6px; border: 1px solid var(--border); }
    .menu-item .title { font-weight: bold; color: var(--text); font-size: 0.95rem; }
    .menu-item .price { color: var(--accent); font-weight: bold; font-size: 0.9rem; }

    /* Dice section */
    .dice-box { text-align: center; padding: 10px; }
    .dice { font-size: 3rem; cursor: pointer; display: inline-block; user-select: none; transition: transform 0.3s; }
    .pun-display { margin-top: 10px; font-style: italic; color: var(--accent); min-height: 2.4em; font-size: 0.95rem; }

    /* Feedback Form */
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-size: 0.9rem; }
    .star-rating { display: flex; gap: 5px; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
    .star-rating .star.active { color: var(--accent); }

    /* Admin Dashboard */
    .admin-only { display: none; }
    .admin-only.un
